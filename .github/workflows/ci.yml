name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_ENABLE_MOCKS: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Production dependencies, high and critical. The frontend workspace is
      # checked separately so `next` itself can be excepted: 14.2.35 is the last
      # 14.x and its open advisories are fixed only in Next >= 15.5.24. Drop the
      # exception once the Next major upgrade lands. Everything else stays gated.
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high -w backend -w packages/shared -w packages/api-client -w packages/design-tokens
          npm audit --omit=dev --json -w frontend > "$RUNNER_TEMP/frontend-audit.json" || true
          jq -e '.metadata.vulnerabilities' "$RUNNER_TEMP/frontend-audit.json" > /dev/null
          jq -e '[.vulnerabilities[] | select(.name != "next" and (.severity == "high" or .severity == "critical")) | .name]
            | if length == 0 then true else error("high/critical advisories: " + join(", ")) end' "$RUNNER_TEMP/frontend-audit.json"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend

      - name: CI gate (typecheck, lint, test, build, MSW e2e + axe)
        run: npm run ci

  # Content/perf gate: production unsafe-content scan, broken
  # link/image crawl, metadata snapshot, console/network error assertions.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      AUDIT_PORT: "3100"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Audit gate (content scan, link/image crawl, metadata, console/network)
        run: npm run audit:ci
