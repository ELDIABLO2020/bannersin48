# Banners In 48 - PostgreSQL 16 configuration (production VPS).
#
# Sized for a 2 vCPU / 7.8 GiB box that also runs the API and Caddy, with
# Postgres capped at 4 GiB by docker-compose.prod.yml. Mounted read-only at
# /etc/postgresql/postgresql.conf and loaded with `-c config_file=...`, so any
# setting not listed here uses the compiled-in default (NOT the initdb sample).

# --- Connections ------------------------------------------------------------
# '*' binds the container's own interfaces only (loopback + the private compose
# network). No port is published to the host, and pg_hba.conf only admits the
# two application roles from that network.
listen_addresses = '*'
port = 5432
max_connections = 60                 # api pool 10 + migrate + admin/backup headroom
superuser_reserved_connections = 3
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
ssl = off                            # traffic never leaves the private Docker network
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# --- Memory -----------------------------------------------------------------
shared_buffers = 2GB
huge_pages = try
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 256MB
autovacuum_work_mem = 128MB
temp_buffers = 8MB

# --- Storage / WAL ----------------------------------------------------------
default_toast_compression = lz4      # new TOASTed values; see migration 20261001000000
wal_compression = zstd
wal_level = replica                  # keeps pg_basebackup / PITR possible later
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = 16MB
random_page_cost = 1.1               # SSD/NVMe
effective_io_concurrency = 200
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- Autovacuum -------------------------------------------------------------
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_max_workers = 2
autovacuum_naptime = 30s

# --- Safety timeouts --------------------------------------------------------
# Global backstops; per-role values are set in init/01-roles.sh.
idle_in_transaction_session_timeout = 5min
lock_timeout = 0
statement_timeout = 0

# --- Logging (stderr -> Docker json-file driver, rotated by the daemon) -----
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_min_duration_statement = 500ms
log_min_error_statement = error
log_statement = 'none'
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_connections = off
log_disconnections = off

# --- Monitoring -------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on

# --- Locale / defaults ------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
