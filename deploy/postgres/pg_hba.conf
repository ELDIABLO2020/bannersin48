# Banners In 48 - PostgreSQL client authentication (production).
# First match wins. SCRAM only; no `trust`, no `md5`.
#
# TYPE  DATABASE     USER                                  ADDRESS        METHOD

# Inside the container: the `postgres` superuser via the Unix socket, only for
# OS user postgres (docker-entrypoint init, `docker compose exec -u postgres`).
local   all          postgres                                             peer
local   all          all                                                  scram-sha-256

# Loopback inside the container (backup.sh runs pg_dump over 127.0.0.1).
host    all          all                                   127.0.0.1/32   scram-sha-256
host    all          all                                   ::1/128        scram-sha-256

# The private compose network: only the two application roles, only this DB.
host    bannersin48  bannersin48_app,bannersin48_migrate   samenet        scram-sha-256

# Everything else (including the superuser over the network) is refused.
host    all          all                                   all            reject
