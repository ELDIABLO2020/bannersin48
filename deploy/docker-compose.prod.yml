# Banners In 48 - production stack (single VPS).
#
#   internet -> caddy (80/443, the ONLY published ports)
#            -> api:3001 (Nest, non-root, read-only rootfs, no internet egress)
#            -> postgres:5432 (never published)
#
# Run from the repo checkout at /srv/bannersin48/app, normally via
# deploy/scripts/deploy.sh. Manual use:
#   docker compose -f deploy/docker-compose.prod.yml <command>
#
# No secrets live in this file. They are read from env files under
# ${BI48_ROOT}/secrets (mode 600, created by deploy/scripts/gen-secrets.sh).
# BI48_ROOT defaults to /srv/bannersin48; override it only for local testing.

name: bannersin48

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    # Pinned by version and digest. Bump both: docker buildx imagetools inspect caddy:2
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ${BI48_ROOT:-/srv/bannersin48}/secrets/site.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge
      - proxy
    mem_limit: 256m
    pids_limit: 256
    logging: *logging

  api:
    image: bannersin48-api:latest
    pull_policy: build # never pull a same-named image from a registry
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    <<: *hardening
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    env_file:
      - ${BI48_ROOT:-/srv/bannersin48}/secrets/site.env
      - ${BI48_ROOT:-/srv/bannersin48}/secrets/api.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      # Artwork (STORAGE_DRIVER=local). Must match LOCAL_STORAGE_DIR in api.env.
      # Host dir is owned by uid/gid 1000 (bootstrap-vps.sh).
      - ${BI48_ROOT:-/srv/bannersin48}/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthcheck comes from the image (GET /health on 127.0.0.1:$PORT).
    networks:
      - proxy
      - db
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 30s
    logging: *logging

  migrate:
    # Same image as api (built by the api service). Never pulled.
    image: bannersin48-api:latest
    pull_policy: never
    <<: *hardening
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: "no"
    env_file:
      # DATABASE_URL for bannersin48_migrate (the schema owner).
      - ${BI48_ROOT:-/srv/bannersin48}/secrets/migrate.env
    command:
      - node
      - /app/node_modules/prisma/build/index.js
      - migrate
      - deploy
      - --schema
      - prisma/schema.prisma
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
    mem_limit: 512m
    pids_limit: 128
    logging: *logging

  postgres:
    # Pinned by version and digest. Bump both: docker buildx imagetools inspect postgres:16-bookworm
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    <<: *hardening
    # The entrypoint starts as root, fixes data-dir ownership, then drops to
    # the postgres user with gosu. These are the only capabilities it needs.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    env_file:
      # POSTGRES_USER/PASSWORD/DB (superuser) + BI48_MIGRATE_PASSWORD / BI48_APP_PASSWORD
      - ${BI48_ROOT:-/srv/bannersin48}/secrets/postgres.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${BI48_ROOT:-/srv/bannersin48}/pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 512m
    healthcheck:
      # TCP (not the socket): during first-boot init the server listens on the
      # socket only, so this stays unhealthy until init scripts have finished.
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres", "-d", "bannersin48"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - db
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 60s
    logging: *logging

networks:
  # Caddy's outbound path (ACME) and the published ports.
  edge:
  # Caddy <-> api. Internal: no route to the internet.
  proxy:
    internal: true
  # api/migrate <-> postgres. Internal: no route to the internet.
  # When the API needs egress (SES, FedEx), attach it to a new non-internal
  # network rather than making these two non-internal.
  db:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
